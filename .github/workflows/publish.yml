# Test every push to main, and publish to npm when package.json carries a
# version npm does not have yet. A release is: bump the version, merge.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing: the job proves to npm, by OpenID Connect, that it
  # is this workflow in this repository, so no npm token is stored anywhere.
  # The same identity signs the package with provenance.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      # The browser checks skip themselves where no Playwright Chromium is
      # installed, as on a plain runner.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Is this version on npm yet?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new; publishing."
          fi

      - name: Publish
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public
