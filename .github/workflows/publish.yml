# Test every push to main, and publish to npm when package.json carries a
# version npm does not have yet. A release is: bump the version, merge.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Lets npm sign the package with provenance: a public record that it was
  # built here, from this commit.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      # The browser checks skip themselves where no Playwright Chromium is
      # installed, as on a plain runner.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Is this version on npm yet?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new; publishing."
          fi

      - name: Publish
        if: steps.version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::No NPM_TOKEN secret, so ${{ steps.version.outputs.version }} was not published. Add one in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 0
          fi
          npm publish --provenance --access public
